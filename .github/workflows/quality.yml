name: quality

on:
  pull_request:
  push:
    branches:
      - main
      - 'cursor/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  feature_flags:
    name: feature-flags
    runs-on: ubuntu-latest
    outputs:
      enabled_ci_lint_format_typecheck: ${{ steps.flags.outputs.enabled_ci_lint_format_typecheck }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Read feature flags
        id: flags
        run: node .github/scripts/feature-flags.mjs

  quality:
    name: quality
    runs-on: ubuntu-latest
    needs: feature_flags
    if: needs.feature_flags.outputs.enabled_ci_lint_format_typecheck == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        id: lint
        run: npm run lint
        continue-on-error: true

      - name: Format check
        id: format
        run: npm run format:check
        continue-on-error: true

      - name: Typecheck
        id: typecheck
        run: npm run typecheck
        continue-on-error: true

      - name: Write summary
        if: always()
        run: |
          LINT_OUTCOME="${{ steps.lint.outcome }}"
          FORMAT_OUTCOME="${{ steps.format.outcome }}"
          TYPECHECK_OUTCOME="${{ steps.typecheck.outcome }}"

          icon () {
            if [ "$1" = "success" ]; then
              echo "✅"
            else
              echo "❌"
            fi
          }

          {
            echo "## Quality gates"
            echo ""
            echo "- $(icon "$LINT_OUTCOME") **lint** (\`npm run lint\`)"
            echo "- $(icon "$FORMAT_OUTCOME") **format** (\`npm run format:check\`)"
            echo "- $(icon "$TYPECHECK_OUTCOME") **typecheck** (\`npm run typecheck\`)"
            echo ""
            echo "### Run locally"
            echo ""
            echo "\`\`\`bash"
            echo "npm ci"
            echo "npm run lint"
            echo "npm run format:check"
            echo "npm run typecheck"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if any check failed
        if: always()
        run: |
          LINT_OUTCOME="${{ steps.lint.outcome }}"
          FORMAT_OUTCOME="${{ steps.format.outcome }}"
          TYPECHECK_OUTCOME="${{ steps.typecheck.outcome }}"

          if [ "$LINT_OUTCOME" != "success" ] || [ "$FORMAT_OUTCOME" != "success" ] || [ "$TYPECHECK_OUTCOME" != "success" ]; then
            exit 1
          fi

  e2e_human_like:
    name: e2e (human-like)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run human-like E2E
        run: npm run e2e:human

      - name: Upload artifacts folder
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artifacts
          path: artifacts
